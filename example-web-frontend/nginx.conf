# ============================================================
# example-web-frontend 生产 Nginx 配置
#   1. 静态托管 Vite 构建产物（dist/）
#   2. 反向代理 API 到后端服务（example-web:8080）
# 前端使用 HashRouter（/#/...），SPA 路由不产生服务端路径，
# 故 /agent /memory 等前缀可安全代理给后端，无路由冲突。
# ============================================================

# WebSocket 透传：有 Upgrade 头则转发，无则关闭（SSE 长连接场景保持兼容）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 基础 gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 入口：SPA 回退到 index.html（HashRouter 下主要命中 /）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API 反向代理（SSE 流式 /agent/chat/stream 需关闭缓冲；WebSocket 透传 Upgrade）----
    location /agent {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
    location /memory {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
    location /rag {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
    location /user {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
    location /auth {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
    location /runs {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
    location /trace {
        proxy_pass http://example-web:8080;
        include /etc/nginx/proxy-sse.conf;
    }
}
