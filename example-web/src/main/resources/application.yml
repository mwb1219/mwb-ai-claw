# ================= Spring 默认 Profile =================
# 默认激活 web 交互模式（REST/SSE/WebSocket）
# 切换 Shell 交互模式：--spring.profiles.active=shell（需提供 application-shell.yml）
spring:
  profiles:
    active: web
  # ================= 数据源（agent.storage.type=db 时生效） =================
  # 默认：MySQL（docker compose up -d 启动，见 example-web/docker-compose.yml）
  #   - 存储形态：记忆/会话/RAG 文档与索引条目文本落 MySQL；召回走 Redis Stack（RediSearch）
  #   - 记忆存储：默认 STORAGE_TYPE=file（零依赖本地文件），切换 =db 时使用此数据源
  # 无 Docker 环境的最小演示：DB_URL=jdbc:h2:mem:clawdb;MODE=MySQL;DB_CLOSE_DELAY=-1 SQL_INIT_MODE=embedded
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clawdb?useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      # embedded=仅嵌入式库执行（默认 H2）；never=关闭（MySQL 建表由 docker initdb 完成）
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
  # ================= 文件上传（RAG 知识库文档） =================
  # 默认不限制文件大小（-1 = 无限制）；有需要可收紧为固定值，如 10MB
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

project:
  name: example-web

# ================= 接入方业务配置 =================
example:
  # example-web 固定单租户 id（用户维度的隔离空间标识，写入 AgentScope.tenantId）
  tenant-id: ${EXAMPLE_TENANT_ID:default}
  # 跨域允许来源（逗号分隔，对应 CorsConfig；生产请显式配置为实际前端域名）
  cors:
    allowed-origins: ${EXAMPLE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  # 用户数据持久化到 claw_user 表（JDBC），需数据源可达（spring.datasource）并先执行 schema.sql 建表

# ================= Agent 配置（OpenAI 兼容） =================
# 前缀 agent，对应 AgentProperties
agent:
  # 存储后端：file（本地文件，默认，零依赖）| db（MySQL 持久化 + Redis Stack 召回：会话/长期记忆/记忆页/知识库落库）
  # 配置 db 时需保证数据源可达（见顶部 spring.datasource 或 .env 中 DB_* 变量），否则启动即连库报错
  storage:
    type: ${STORAGE_TYPE:file}
  # ===== Redis 检索索引（agent.redis.*，agent.storage.type=db 时使用 RediSearch 召回） =====
  # 连接复用 spring.data.redis.*（与分布式会话锁同源，见 collaboration.lock.redis-uri 兜底）
  redis:
    index-prefix: ${REDIS_INDEX_PREFIX:claw}   # 索引 key 前缀（多环境/多租户共享 Redis 时隔离命名空间）
  # ===== 可观测性 =====
  # run-usage-store=local（默认，JSONL 文件）| db（落 claw_run_usage 表，与会话/记忆/RAG 同库，多实例共享，生产推荐）
  # trace store=local（默认，本地 JSON，零依赖）| db（落 claw_trace 表，生产推荐）
  observability:
    run-usage-store: ${RUN_USAGE_STORE:db}
    trace:
      enabled: ${TRACE_ENABLED:true}
      store: ${TRACE_STORE:db}
      dir: ${TRACE_DIR:}
  # ===== 会话并发锁（T3 横向扩展能力） =====
  # local（默认，JVM 内 ReentrantLock，单实例）| redis（SET NX PX 分布式锁，多实例部署共享）。
  # 默认 redis：依赖 docker compose 中的 Redis；无 Redis 环境可切 local（--agent.collaboration.lock.type=local）
  collaboration:
    lock:
      type: ${LOCK_TYPE:redis}
      redis-uri: ${REDIS_URI:redis://localhost:6379}
      key-prefix: ${LOCK_KEY_PREFIX:claw:lock:}
  agent-id: default
  name: mwb-ai-claw
  system-prompt: 你是 mwb-ai-claw 智能助手。当需要时可以调用工具来完成任务，完成后给出简洁回复。
  # 默认编排 id（引用 orchestrations.json 中的 id；多 Agent 协作编排经 invoke_* 工具由主 Agent 自主发起）
  orchestration: routing
  # 模型配置通过环境变量（.env / 系统环境变量）注入，避免密钥泄露
  model: ${DEFAULT_MODEL:deepseek-chat}
  base-url: ${DEFAULT_BASE_URL:https://api.deepseek.com}
  api-key: ${DEFAULT_API_KEY:}
  temperature: 0.7
  # DeepSeek V4 思考模式下 reasoning 计入 max_tokens 预算：2048 会被推理占满导致最终回复/工具调用被截断为空，
  # 提高到 8192 保证「推理 + 完整回复 + 工具调用」有足够空间
  max-tokens: 8192
  max-steps: 8
  # ReAct 步数扩展系数：初始预算(max-steps)用尽且工具链未完成时自动扩展，硬上限 = max-steps × 系数（>1 生效，默认 2.0）
  max-steps-extension: 2.0
  # 长期记忆目录（AGENT.md / MEMORY.md 存放位置，默认 ${user.dir}/.agent）
  memory-dir: ""
  # 技能（Skill）支持：渐进式披露 —— 技能清单常驻 system prompt，SKILL.md 正文按需经 use_skill 工具加载
  skills-enabled: true            # 技能总开关（false 时不加载技能、不注册 use_skill 工具）
  skills-dir: ""                  # 技能根目录（默认 ${user.dir}/skills；加载顺序：运行目录 → 安装目录 skills → classpath 内置）
  # 可用工具列表：缺省（不配置）= 绑定全部已注册工具（内置 + 全局/MCP）；
  # 指定后 = 强制仅绑定声明的工具（use_skill / MCP / invoke_* 等全局工具需显式加入）
  # tools:
  #   - echo
  #   - http
  #   - file
  #   - shell
  #   - shell_status
  #   - read_memory
  #   - write_memory
  # 分层记忆（突破上下文窗口：分层存储 + 动态换页 + 检索召回）
  # 直接对应 AgentProperties.memory（LayeredMemoryConfig），命令行覆盖示例：
  #   --agent.memory.summary-block-size=2 --agent.memory.hot-window-size=4
  memory:
    enabled: true                  # 是否启用分层记忆
    context-window-tokens: 200000   # 模型上下文窗口（tokens），用于预算计算
    context-budget-ratio: 0.6      # 记忆区占模型窗口比例
    prompt-budget-ratio: 0.25      # System 区（AGENT.md + 事实页）占记忆预算比例
    tool-budget-ratio: 0.25        # Tools 区占记忆预算比例
    hot-window-size: 20            # 工作记忆：Hot 原文最大条数
    summary-block-size: 10         # 多少条消息合成一个摘要块（触发换页）
    importance-threshold: 0.6      # 事实写入长期记忆的重要度阈值
    top-k: 5                       # 关键词检索召回条数
    eviction-policy: importance         # 换页策略：token（预算驱动）| importance（重要度驱动）
    synthesis-async: true          # 提炼是否异步执行（线程池串行，不阻塞主对话链路）
    # ===== Phase 3：向量检索 + 跨会话档案 RAG + 多 Agent 共享记忆 =====
    retriever: hybrid              # 检索器：keyword（关键词）| vector（向量）| hybrid（RRF 融合，默认）
    vector-enabled: true           # 是否启用向量索引（embedding 不可用时自动降级为空结果，由 hybrid 回退关键词）
    embedding-model: ${EMBEDDING_MODEL:}          # Embedding 模型名（OpenAI 兼容，如 text-embedding-3-small；留空继承主模型，DeepSeek 不支持 embeddings 需在 .env 配置或关闭）
    embedding-base-url: ${EMBEDDING_BASE_URL:}    # Embedding Base URL（留空继承 agent.base-url）
    embedding-api-key: ${EMBEDDING_API_KEY:}      # Embedding API Key（留空继承 agent.api-key）
    archive-enabled: true          # 会话结束后归档原文为 ARCHIVE 页（跨会话档案 RAG 数据源）
    shared-retrieve: true          # 多 Agent 共享：readContext 时自动检索其他会话的档案/摘要/事实并换入
    # ===== Phase 4：成本优化 =====
    synthesizer-model: ${SYNTHESIS_MODEL:}          # 小模型提炼：提炼专用模型（留空继承主模型，可用更便宜的模型降低成本）
    synthesizer-base-url: ${SYNTHESIS_BASE_URL:}    # 小模型提炼：Base URL（留空继承 agent.base-url）
    synthesizer-api-key: ${SYNTHESIS_API_KEY:}      # 小模型提炼：API Key（留空继承 agent.api-key）
    synthesis-cache-size: 50        # 提炼缓存容量（按输入内容哈希去重，避免重复调 LLM；<=0 关闭）
  # ===== 独立 RAG 知识库（agent.rag.*，默认关闭；本例开启演示「写入 + 检索 + 上下文注入」）=====
  # 与记忆系统完全隔离：独立领域模型 / 存储 / Embedding 配置 / 检索链路
  # RAG 依赖 Embedding 接口可用，请配置下面的 RAG_EMBEDDING_* 环境变量（OpenAI 兼容 /embeddings）
  rag:
    enabled: true                  # 总开关（关闭后 RAG Bean 与 /rag 接口不装配，行为与未接入前一致）
    # 索引实现：auto（默认，跟随 agent.storage.type：file→local 本地索引，db→redis 走 Redis Stack 召回）
    # 显式声明 redis 与 auto + db 等价；其它值不匹配内置装配，由业务方自定义 RagIndexStore 扩展实现
    provider: ${RAG_PROVIDER:auto}
    # ===== Redis Stack 召回（provider=auto + storage=db 时生效）：向量 + 全文倒排索引存 Redis，
    # MySQL 仅存文本/元数据（见 db/mysql/framework-schema.sql 的 rag_index_entries 表，无向量列） =====
    # ===== 知识库 API 层访问控制（T4 生产化能力；本例演示 ExampleRagAccessPolicy 租户前缀策略） =====
    access:
      enabled: true                # 开启后 /rag 接口按注入的 RagAccessPolicy 鉴权；关闭则全部放行（保持全局共享检索语义）
    # ===== 容量与配额（T4 生产化能力；0=不限制） =====
    capacity:
      max-documents-per-knowledge-base: 100   # 单个知识库最大文档数
      max-chunks-per-document: 1000           # 单个文档最大分块数
      max-document-chars: 1000000             # 单个文档解析后文本最大字符数
    ingestion:
      chunk-size: 500              # 单块文本长度上限（字符）
      chunk-overlap: 50            # 相邻分块重叠（字符）
      embedding-batch-size: 32     # 批量向量化单批条数
    retrieval:
      top-k: 5                     # 默认召回条数
      min-score: 0.2               # 默认最低相似度阈值
      require-knowledge-base-id: false   # 是否强制要求请求显式指定知识库
    embedding:
      # Embedding 模型（OpenAI 兼容）：未配置时 RAG 写入/检索会报错，用于演示请在 .env 配置
      model: ${RAG_EMBEDDING_MODEL:}
      base-url: ${RAG_EMBEDDING_BASE_URL:}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      # 单次 HTTP 请求最大文本条数（模型侧批量上限，如阿里云 MaaS 为 20）；Gateway 内部分批保证不超限
      max-batch-size: 16
    context:
      max-chars: 8000              # 单次注入 system prompt 的知识内容字符上限
  # Agent 注册表（agents.json）与编排注册表（orchestrations.json）已独立到 example-web/src/main/resources 下
  # 可在运行目录放置同名文件覆盖（支持 ${VAR:default} 占位符），或使用 classpath 默认模板
  # 工具安全配置
  security:
    enabled: true
    # 文件操作根目录（留空则不限制）
    workspace-dir: ""
    # Shell 命令白名单（仅允许以下命令被 LLM 调用）
    shell-whitelist:
      # 基础文件 & 目录
      - ls
      - cat
      - echo
      - pwd
      - mkdir
      - touch
      - rm
      - cp
      - mv
      - cd
      - chmod
      - chown
      # 文本处理
      - grep
      - find
      - wc
      - head
      - tail
      - sort
      - uniq
      - cut
      - tr
      - tee
      - diff
      - sed
      - awk
      - xargs
      # 压缩解压
      - tar
      - gzip
      - gunzip
      - zip
      - unzip
      # 系统信息
      - date
      - whoami
      - env
      - uname
      - df
      - du
      - free
      - ps
      - lsof
      - netstat
      - ss
      - top
      # 网络调试
      - curl
      - wget
      - ping
      - dig
      - nslookup
      # 版本管理
      - git
      - nvm
      - sdk
      - pyenv
      # 语言运行时
      - python3
      - python
      - node
      - java
      - javac
      - go
      # 包管理 & 构建
      - npm
      - npx
      - pip
      - pip3
      - mvn
      - gradle
      - make
      - cargo
      - brew
      - gem
      # 编辑器
      - nano
      - vim
      - code
      # 进程管理
      - kill
      # 数据库
      - sqlite3
      # 远程操作（需黑名单严格限制）
      - ssh
      - scp
    # Shell 命令黑名单（优先级高于白名单，命中即拒绝）
    shell-blacklist:
      # 危险删除
      - "rm -rf /"
      - "rm -rf ~"
      - "rm -rf ."
      # 提权 & 关机
      - sudo
      - "su "
      - shutdown
      - reboot
      - halt
      - poweroff
      # 磁盘操作
      - mkfs
      - "dd if="
      - "> /dev/sda"
      - "mkfs."
      # 权限 & 属主
      - "chmod 777"
      - "chown root"
      - "chmod -R"
      # Fork bomb
      - ":(){ :|:"
    # Shell 审批模式：auto（白名单内自动执行）| ask（命中审批规则时询问用户 y/N，默认）| read-only（命中审批规则时拒绝执行）
    shell-approval-mode: ask
    # Shell 审批规则（子串匹配，不区分大小写）：ask 模式下命中即请求用户确认，read-only 模式下命中即拒绝
    shell-approval-patterns:
      # Git 不可逆 / 变更操作
      - "git push"
      - "git reset"
      - "git revert"
      - "git clean"
      - "git commit"
      - "git rm"
      - "git mv"
      # 文件系统变更
      - "rm "
      - "mv "
      - "cp "
      - "chmod"
      - "chown"
      - "tee "
      - "dd "
      # 进程管理
      - "kill "
      # 包管理（安装/卸载会改动系统或项目）
      - "npm install"
      - "npm uninstall"
      - "npm remove"
      - "pip install"
      - "pip uninstall"
      - "pip3 install"
      - "brew install"
      - "brew uninstall"
      - "gem install"
      # 网络写操作
      - "ssh "
      - "scp "
      - "curl -X"
      - "curl --data"
      - "curl --upload"
      - "curl -F"
      - "wget "
      # 压缩 / 格式化 / 磁盘
      - "tar "
      - "gzip"
      - "gunzip"
      - "zip "
      - "unzip"
      - "mkfs"
      - "fdisk"
      - "> "
      # 清理 / 缓存操作（同样不可逆或影响构建，需审批；避免模型用 npm cache clean 等绕过审批直接执行）
      - "npm cache"
      - "yarn cache"
      - "pnpm store"
      - "pnpm cache"
      - "pip cache"
      - "pip3 cache"
      - "cargo clean"
      - "go clean"
      - "mvn clean"
      - "gradle clean"
      - "make clean"
      - "brew cleanup"
      # find 危险动作（递归删除 / 执行任意命令）
      - "-delete"
      - "-exec"
      # 代码执行（任意脚本注入）
      - "node -e"
      - "python3 -c"
      - "python -c"
      - "npx "
      # 文件系统低级写操作
      - "unlink "
      - "truncate "
    # 单个工具执行超时（秒）
    tool-timeout-seconds: 30
    # 工具输出最大长度（字符数），超出截断
    max-output-length: 10000
    # HTTP 请求允许的 host 模式（空列表表示全部允许）
    http-allowed-hosts: []

  # ===== 鉴权（agent.auth.*）=====
  auth:
    # 是否开启鉴权（示例工程默认开启；关闭后行为与单租户一致，scope=default）
    enabled: ${AUTH_ENABLED:true}
    # API Key 请求头（默认 X-API-Key；同时支持 Authorization: Bearer 与 SSE ?apiKey=）
    header: X-API-Key
    # 静态引导 Key（tenantId → userId → apiKey）：作为持久化用户之外的兜底/引导管理员 Key。
    # 用户注册/登录已提供常规入口；本 Key 用于首次启动直接以管理员身份访问 /user 管理界面。
    api-keys:
      admin:                                        # 租户 id
        admin: ${BOOTSTRAP_API_KEY:sk-admin-bootstrap}  # 用户 id: API Key
    # 工具级权限：userId → 可用工具列表（缺省 = 全部允许）
    tool-permissions: {}

# ================= MCP Server 配置 =================
# 已独立到 mcp-server.json 文件（与 Cursor / Claude 的 mcp.json 格式一致）。
# 编辑 example-web/src/main/resources/mcp-server.json，或在运行目录放置外部 mcp-server.json 覆盖。
