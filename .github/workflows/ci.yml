name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Java (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2 # 限制并发，避免首次构建对 Maven Central 触发 429 限流
      matrix:
        java: [8, 11, 17, 21] # 编译目标为 Java 8，多 JDK 验证运行兼容性
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile and run tests
        run: mvn -B clean test

  frontend:
    name: Frontend sample
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: example-web-frontend/package-lock.json

      - name: Build example-web-frontend
        run: |
          cd example-web-frontend
          npm ci
          npm run build

  release:
    name: Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Package binary distribution
        run: bash tools/package.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
