# ================= Spring 默认 Profile =================
# 默认激活 web 交互模式（REST/SSE/WebSocket）
# 切换 Shell 交互模式：--spring.profiles.active=shell
spring:
  profiles:
    active: web

project:
  name: start

# ================= Agent 配置（OpenAI 兼容） =================
# 前缀 agent，对应 AgentProperties
agent:
  agent-id: default
  name: mwb-ai-claw
  system-prompt: 你是 mwb-ai-claw 智能助手。当需要时可以调用工具来完成任务，完成后给出简洁回复。
  # 协作模式（决定加载哪个 {mode}-agents.json），默认 routing
  mode: routing
  # 模型配置通过环境变量（.env / 系统环境变量）注入，避免密钥泄露
  model: ${DEFAULT_MODEL:deepseek-chat}
  base-url: ${DEFAULT_BASE_URL:https://api.deepseek.com}
  api-key: ${DEFAULT_API_KEY:}
  temperature: 0.7
  max-tokens: 2048
  max-steps: 8
  # 长期记忆目录（AGENT.md / MEMORY.md 存放位置，默认 ${user.dir}/.agent）
  memory-dir: ""
  # 可用工具列表
  tools:
    - echo
    - http
    - file
    - shell
    - read_memory
    - write_memory
  # 专家 Agent 配置已独立到 {mode}-agents.json（默认 routing-agents.json）
  # 可在运行目录下新增/修改，或使用 classpath 默认模板
  # 工具安全配置
  security:
    enabled: true
    # 文件操作根目录（留空则不限制）
    workspace-dir: ""
    # Shell 命令白名单（仅允许以下命令被 LLM 调用）
    shell-whitelist:
      # 基础文件 & 目录
      - ls
      - cat
      - echo
      - pwd
      - mkdir
      - touch
      - rm
      - cp
      - mv
      - cd
      - chmod
      - chown
      # 文本处理
      - grep
      - find
      - wc
      - head
      - tail
      - sort
      - uniq
      - cut
      - tr
      - tee
      - diff
      - sed
      - awk
      - xargs
      # 压缩解压
      - tar
      - gzip
      - gunzip
      - zip
      - unzip
      # 系统信息
      - date
      - whoami
      - env
      - uname
      - df
      - du
      - free
      - ps
      - lsof
      - netstat
      - ss
      - top
      # 网络调试
      - curl
      - wget
      - ping
      - dig
      - nslookup
      # 版本管理
      - git
      - nvm
      - sdk
      - pyenv
      # 语言运行时
      - python3
      - python
      - node
      - java
      - javac
      - go
      # 包管理 & 构建
      - npm
      - npx
      - pip
      - pip3
      - mvn
      - gradle
      - make
      - cargo
      - brew
      - gem
      # 编辑器
      - nano
      - vim
      - code
      # 进程管理
      - kill
      # 数据库
      - sqlite3
      # 远程操作（需黑名单严格限制）
      - ssh
      - scp
    # Shell 命令黑名单（优先级高于白名单，命中即拒绝）
    shell-blacklist:
      # 危险删除
      - "rm -rf /"
      - "rm -rf ~"
      - "rm -rf ."
      # 提权 & 关机
      - sudo
      - "su "
      - shutdown
      - reboot
      - halt
      - poweroff
      # 磁盘操作
      - mkfs
      - "dd if="
      - "> /dev/sda"
      - "mkfs."
      # 权限 & 属主
      - "chmod 777"
      - "chown root"
      - "chmod -R"
      # Fork bomb
      - ":(){ :|:"
    # 单个工具执行超时（秒）
    tool-timeout-seconds: 30
    # 工具输出最大长度（字符数），超出截断
    max-output-length: 10000
    # HTTP 请求允许的 host 模式（空列表表示全部允许）
    http-allowed-hosts: []

# ================= MCP Server 配置 =================
# 已独立到 mcp-server.json 文件（与 Cursor / Claude 的 mcp.json 格式一致）。
# 编辑 start/src/main/resources/mcp-server.json，或在运行目录放置外部 mcp-server.json 覆盖。
